name: Build and test

on:
  pull_request:

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test SSH and terminal packages
        run: make test
      - name: Install Metal compiler component
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Restore libghostty-vt
        id: ghostty
        uses: actions/cache@v4
        with:
          path: build/vendor/ghostty-vt.xcframework
          key: ghostty-vt-${{ hashFiles('scripts/build_ghostty_vt.sh') }}
      # The app links the #10 trial engine, whose xcframework is not in the repository. The
      # cache key is the build script, which carries the pinned commit, so this runs again only
      # when the pin moves.
      - name: Build libghostty-vt
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: |
          brew install zig
          scripts/build_ghostty_vt.sh
      - name: Build iPhone and iPad app
        run: make build
      - name: Test app lifecycle and UI
        run: |
          IOSSH_SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime in sorted(devices, reverse=True) if "iOS" in runtime for d in devices[runtime] if d["isAvailable"] and d["name"].startswith("iPhone")))')
          xcodebuild -project iOSSH.xcodeproj -scheme iOSSH -destination "platform=iOS Simulator,id=$IOSSH_SIMULATOR_ID" -derivedDataPath build/DerivedData -resultBundlePath build/CI.xcresult -skipPackagePluginValidation -parallel-testing-enabled NO test
      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: build/CI.xcresult
          if-no-files-found: ignore
          retention-days: 7
