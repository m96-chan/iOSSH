name: Build and test

on:
  pull_request:

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      # Reading two JSON files, so it costs nothing and is worth failing on before a build.
      - name: Check package pins agree
        run: make check-pins
      - name: Install Metal compiler component
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Restore libghostty-vt
        id: ghostty
        uses: actions/cache@v4
        with:
          path: build/vendor/ghostty-vt.xcframework
          key: ghostty-vt-${{ hashFiles('scripts/build_ghostty_vt.sh') }}
      # The app links the #10 trial engine, whose xcframework is not in the repository. The
      # cache key is the build script, which carries the pinned commit, so this runs again only
      # when the pin moves.
      - name: Build libghostty-vt
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: |
          brew install zig
          scripts/build_ghostty_vt.sh
      # After the xcframework exists, because GhosttyEngine's tests link against it.
      - name: Test SSH, terminal and Ghostty packages
        run: make test
      - name: Build iPhone and iPad app
        run: make build
      # The bundled notices are what the store submission ships, and nothing else compares them
      # against the dependencies the app actually links. The checkouts are the ones make build
      # just resolved.
      - name: Check bundled third-party notices
        run: python3 scripts/generate_third_party_notices.py --checkouts build/DerivedData/SourcePackages/checkouts --check
      # The iPad workspace tests are idiom-gated and skip on an iPhone, so they need a second
      # destination. A second test invocation rather than a job matrix: the app and its test
      # bundles are already built in this job, and the matrix would rebuild both from scratch.
      - name: Test app lifecycle and UI on iPhone and iPad
        run: |
          # Both destinations boot a device, and a failing xcodebuild would otherwise leave them
          # running for the rest of the job, so the trap covers the failure path too.
          trap 'xcrun simctl shutdown all >/dev/null 2>&1 || true' EXIT
          for family in iPhone iPad; do
            udid=$(scripts/prepare_simulator.sh "$family")
            xcodebuild -project iOSSH.xcodeproj -scheme iOSSH -destination "platform=iOS Simulator,id=$udid" -derivedDataPath build/DerivedData -resultBundlePath "build/CI-$family.xcresult" -skipPackagePluginValidation -parallel-testing-enabled NO test
          done
      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: build/CI-*.xcresult
          if-no-files-found: ignore
          retention-days: 7
