name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test SSH and terminal packages
        run: make test
      - name: Install Metal compiler component
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Build iPhone and iPad app
        run: make build
      - name: Test app lifecycle and UI
        run: |
          IOSSH_SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime in sorted(devices, reverse=True) if "iOS" in runtime for d in devices[runtime] if d["isAvailable"] and d["name"].startswith("iPhone")))')
          xcodebuild -project iOSSH.xcodeproj -scheme iOSSH -destination "platform=iOS Simulator,id=$IOSSH_SIMULATOR_ID" -derivedDataPath build/DerivedData -resultBundlePath build/CI.xcresult -skipPackagePluginValidation -parallel-testing-enabled NO test
      - name: Upload test results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: build/CI.xcresult
          if-no-files-found: ignore
          retention-days: 7
