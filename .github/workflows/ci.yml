name: Build and test

on:
  pull_request:

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      # A documentation-only pull request cannot change what the app builds or how it behaves,
      # and everything below takes about 45 minutes.
      #
      # Gated per step rather than with `paths-ignore` on purpose. `ios` is a required status
      # check on main and `enforce_admins` is on, so a workflow that never runs leaves that
      # check pending forever and the pull request becomes unmergeable by anybody, including an
      # administrator. A job that runs and skips its steps still reports `ios` as successful.
      - name: Decide whether this change can reach the build
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
                    --paginate --jq '.[].filename')
          printf 'Changed files:\n%s\n' "$files"
          # Markdown and the licence at the repository root are not compiled, not bundled and
          # not read by anything here: the app's sources are App/, its only extra resource is
          # the shortcut, and the notice generator reads Package.resolved, project.yml,
          # scripts/build_ghostty_vt.sh and scripts/third_party_licenses. Everything else
          # builds, including an unexpectedly empty list.
          # `grep -v` and not `grep -qv`: the two disagree on their exit status under at least
          # one drop-in grep in the wild, so this tests the output rather than the status.
          other=$(printf '%s\n' "$files" | grep -vE '\.md$|^LICENSE$' || true)
          if [ -n "$files" ] && [ -z "$other" ]; then
            echo "Documentation only. Skipping the build and tests."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Show toolchain
        if: steps.scope.outputs.build == 'true'
        run: |
          xcodebuild -version
          swift --version
      # Reading two JSON files, so it costs nothing and is worth failing on before a build.
      - name: Check package pins agree
        if: steps.scope.outputs.build == 'true'
        run: make check-pins
      - name: Install Metal compiler component
        if: steps.scope.outputs.build == 'true'
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Restore libghostty-vt
        id: ghostty
        if: steps.scope.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: build/vendor/ghostty-vt.xcframework
          key: ghostty-vt-${{ hashFiles('scripts/build_ghostty_vt.sh') }}
      # The app links the #10 trial engine, whose xcframework is not in the repository. The
      # cache key is the build script, which carries the pinned commit, so this runs again only
      # when the pin moves.
      - name: Build libghostty-vt
        if: steps.scope.outputs.build == 'true' && steps.ghostty.outputs.cache-hit != 'true'
        run: |
          brew install zig
          scripts/build_ghostty_vt.sh
      # After the xcframework exists, because GhosttyEngine's tests link against it.
      - name: Test SSH, terminal and Ghostty packages
        if: steps.scope.outputs.build == 'true'
        run: make test
      # Built once for both destinations. Splitting it was costing two extra builds: a
      # destination change gives Xcode a different build description, so `generic/platform=iOS
      # Simulator` and then each concrete simulator each rebuilt from scratch. On the last full
      # run that was 3m56s for the app and another 3m45s before the iPad ran its first test,
      # neither of which produced anything the previous build had not.
      #
      # The `generic` destination is gone with it. These two cover the same compilation; what
      # they do not cover is a simulator architecture no runner has, which is not a thing this
      # project ships to.
      - name: Prepare the iPhone and iPad simulators
        id: simulators
        if: steps.scope.outputs.build == 'true'
        run: |
          for family in iPhone iPad; do
            udid=$(scripts/prepare_simulator.sh "$family")
            echo "$family=$udid" >> "$GITHUB_OUTPUT"
          done
      - name: Build the app and its test bundles for both idioms
        if: steps.scope.outputs.build == 'true'
        run: |
          xcodebuild -project iOSSH.xcodeproj -scheme iOSSH \
            -destination "platform=iOS Simulator,id=${{ steps.simulators.outputs.iPhone }}" \
            -destination "platform=iOS Simulator,id=${{ steps.simulators.outputs.iPad }}" \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation build-for-testing
      # The bundled notices are what the store submission ships, and nothing else compares them
      # against the dependencies the app actually links. The checkouts are the ones the build
      # above just resolved, and this runs before the tests so a stale notice is not thirty
      # minutes away from being reported.
      - name: Check bundled third-party notices
        if: steps.scope.outputs.build == 'true'
        run: python3 scripts/generate_third_party_notices.py --checkouts build/DerivedData/SourcePackages/checkouts --check
      # The iPad workspace tests are idiom-gated and skip on an iPhone, so they need a second
      # destination. Both reuse the build above rather than making their own.
      - name: Test app lifecycle and UI on iPhone
        if: steps.scope.outputs.build == 'true'
        run: |
          xcodebuild -project iOSSH.xcodeproj -scheme iOSSH \
            -destination "platform=iOS Simulator,id=${{ steps.simulators.outputs.iPhone }}" \
            -derivedDataPath build/DerivedData -resultBundlePath build/CI-iPhone.xcresult \
            -skipPackagePluginValidation -parallel-testing-enabled NO test-without-building
      # Runs even when the iPhone failed: the build is already paid for, and one run that
      # reports both idioms is one round trip instead of two.
      - name: Test app lifecycle and UI on iPad
        if: always() && steps.scope.outputs.build == 'true'
        run: |
          xcodebuild -project iOSSH.xcodeproj -scheme iOSSH \
            -destination "platform=iOS Simulator,id=${{ steps.simulators.outputs.iPad }}" \
            -derivedDataPath build/DerivedData -resultBundlePath build/CI-iPad.xcresult \
            -skipPackagePluginValidation -parallel-testing-enabled NO test-without-building
      # Both destinations stay booted across the steps above, so this is what shuts them down —
      # including when a step above failed and left them running.
      - name: Shut the simulators down
        if: always()
        run: xcrun simctl shutdown all >/dev/null 2>&1 || true
      - name: Upload test results and screenshots
        if: always() && steps.scope.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: build/CI-*.xcresult
          if-no-files-found: ignore
          retention-days: 7
