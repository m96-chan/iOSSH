name: iOSSH
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
packages:
  SSHCore:
    path: Packages/SSHCore
  TerminalCore:
    path: Packages/TerminalCore
  TerminalRender:
    path: Packages/TerminalRender
  GhosttyEngine:
    path: spike/GhosttyEngine
targets:
  iOSSH:
    type: application
    platform: iOS
    sources:
      - App
      - path: shortcuts/Import Tailscale Hosts.shortcut
        buildPhase: resources
    dependencies:
      - package: SSHCore
      - package: TerminalCore
      - package: TerminalRender
      - package: GhosttyEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.m96-chan.iossh
        PRODUCT_NAME: iOSSH
        # The #10 trial engine's xcframework carries an arm64 simulator slice and no x86_64 one,
        # and a generic simulator destination builds the standard architectures, which includes
        # x86_64. Nothing that runs this is an Intel Mac; asking for that slice only fails the
        # link. Drop it rather than building a second copy of the library for nobody.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        MARKETING_VERSION: 0.1.1
        CURRENT_PROJECT_VERSION: 14
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: iOSSH
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleURLTypes:
          - CFBundleURLName: io.github.m96-chan.iossh.shortcuts
            CFBundleURLSchemes:
              - io.github.m96-chan.iossh
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Unlock your saved SSH credentials.
        NSLocalNetworkUsageDescription: Connect to SSH servers on your local network.
        CADisableMinimumFrameDurationOnPhone: true
        # Picture in Picture is the only way iOS offers to keep a terminal on screen — and the
        # process out of suspension, which keeps its SSH session alive (#39, #46). The controller
        # requires this mode and an active audio session even for a source that plays nothing;
        # `TerminalPictureInPicture` activates the session with `.mixWithOthers` so it never
        # silences what the person is listening to.
        UIBackgroundModes:
          - audio
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  iOSSHUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: iOSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.m96-chan.iossh.uitests
        GENERATE_INFOPLIST_FILE: true
  iOSSHTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: iOSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.m96-chan.iossh.tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  iOSSH:
    build:
      targets:
        iOSSH: all
    test:
      targets:
        - iOSSHTests
        - iOSSHUITests
